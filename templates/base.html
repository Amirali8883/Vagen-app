<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

</head>
<body>
    <!-- Navigation Bar -->
    <header class="app-header">
        <div class="logo">
            <a href="#">Vågen-match</a>
        </div>
        <nav class="nav-bar">
            <ul class="nav-list">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Discover</a></li>
                <li class="nav-item"><a href="#" class="nav-link">My Profile</a></li>
                <li class="nav-item"><a href="#" class="nav-link login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        
        <!-- Welcome Card -->
        <section class="welcome-card">
            <h1 class="welcome-title">Velkomen</h1>
            <p class="welcome-text">
                finn din perfekte match i dag. Koble deg til mennesker som deler dine interesser og verdier.
            </p>
            <div class="cta-container">
                <a href="#" class="get-started-btn">Get started</a>
            </div>
        </section>

    </main>
    {% block content %}
    {% endblock %}
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
