<header class="app-header">
    <a href="{{ url_for('home') }}" class="logo">
        <span class="logo-icon">Vågen-match</span>
    </a>

    <button class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation menu"
            aria-expanded="false">☰</button>

    <nav class="nav-bar" id="navBar">
        <ul class="nav-list">
            <li>
                <a href="{{ url_for('home') }}"
                   class="nav-link{% if request.endpoint == 'home' %} active{% endif %}">
                    Home
                </a>
            </li>
            <li>
                <a href="{{ url_for('discover') if session.get('user') or DEV_MODE else url_for('login') }}"
                   class="nav-link{% if request.endpoint == 'discover' %} active{% endif %}">
                    Discover
                </a>
            </li>
            <li>
                <a href="{{ url_for('profile') if session.get('user') or DEV_MODE else url_for('login') }}"
                   class="nav-link{% if request.endpoint == 'profile' %} active{% endif %}">
                    My Profile
                </a>
            </li>
            <li>
                {% if session.get('user') %}
                    <a href="{{ url_for('user') }}"
                       class="nav-link login-btn{% if request.endpoint == 'user' %} active{% endif %}">
                        {{ session['user'] }}
                    </a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-link login-btn">Login</a>
                {% endif %}
            </li>
            {% if session.get('user') %}
                <li>
                    <a href="{{ url_for('logout') }}" class="nav-link">Log out</a>
                </li>
            {% endif %}
        </ul>
    </nav>
</header>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
