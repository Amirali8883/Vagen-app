services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://vagen_user:${DB_PASSWORD:?DB_PASSWORD must be set; run docker compose --env-file secret.env up}@db:5432/vagen_match
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: vagen_match
      POSTGRES_USER: vagen_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set; run docker compose --env-file secret.env up}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagen_user -d vagen_match"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: